name: PR route check

# One PR, one route (governance/pre_pr_check.md). The pull_request job checks a PR
# whose base carries this workflow. The sweep runs from the default branch, so it
# also reaches stacked PRs, and sets a pr-route-check status on each PR's head.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: One PR, one route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pr_route_check.py --github

  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pr_route_check.py --sweep
